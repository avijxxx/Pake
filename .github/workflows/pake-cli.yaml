name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL, auto-fetch if empty"
        required: false
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Package formats (comma-separated: deb,appimage,rpm)"
        required: false
        default: "deb"
      login_username:
        description: "Login username (auto-login)"
        required: false
      login_password:
        description: "Login password (auto-login)"
        required: false
      login_username_selector:
        description: "Custom CSS selector for username input (auto-detect if empty)"
        required: false
      login_password_selector:
        description: "Custom CSS selector for password input (auto-detect if empty)"
        required: false
      login_button_selector:
        description: "Custom CSS selector for login button (auto-detect if empty)"
        required: false
      debug:
        description: "Debug build (enables Ctrl+Shift+I DevTools)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup login credentials
        if: inputs.login_username != '' && inputs.login_password != ''
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = 'src-tauri/pake.json';
          const pake = JSON.parse(fs.readFileSync(path, 'utf8'));
          const user = '${{ inputs.login_username }}'.replace(/'/g, "\\'").replace(/\\n/g, '\\n');
          const pass = '${{ inputs.login_password }}'.replace(/'/g, "\\'").replace(/\\n/g, '\\n');
          const userSel = '${{ inputs.login_username_selector }}' || '';
          const passSel = '${{ inputs.login_password_selector }}' || '';
          const btnSel  = '${{ inputs.login_button_selector }}'   || '';
          pake.inject = [
            "(function() {",
            "  var U = '" + user + "';",
            "  var P = '" + pass + "';",
            "  if (!U || !P) return;",
            "  var US='" + userSel + "', PS='" + passSel + "', BS='" + btnSel + "';",
            "  var attempts = 0;",
            "  var timer = setInterval(function() {",
            "    attempts++;",
            "    var u = US ? document.querySelector(US) : (",
            "      document.querySelector('#username, input[name=username], input[type=email], input[autocomplete=username], input[placeholder*=username i], input[placeholder*=email i], input[placeholder*=account i]'));",
            "    var p = PS ? document.querySelector(PS) : (",
            "      document.querySelector('#password, input[name=password], input[type=password], input[autocomplete=current-password], input[placeholder*=password i], input[placeholder*=pass i]'));",
            "    var btn = BS ? document.querySelector(BS) : (",
            "      document.querySelector('#login, button[type=submit], input[type=submit], [data-testid=login], [aria-label*=login i], [aria-label*=sign i], button[id*=login i], button[id*=sign i], button[class*=login i], button[class*=sign i]'));",
            "    if (u && p && btn) {",
            "      clearInterval(timer);",
            "      var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;",
            "      nativeInputValueSetter.call(u, U); u.dispatchEvent(new Event('input', { bubbles: true }));",
            "      nativeInputValueSetter.call(p, P); p.dispatchEvent(new Event('input', { bubbles: true }));",
            "      btn.style.outline = '3px solid red';",
            "      setTimeout(function() { btn.click(); }, 500);",
            "    } else if (attempts >= 30) {",
            "      clearInterval(timer);",
            "      var d = document.createElement('div');",
            "      d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;z-index:2147483647;padding:10px;font:13px monospace;line-height:1.6';",
            "      d.textContent = '[Pake] auto-login failed after ' + attempts + ' polls. Found: username=' + !!u + ' password=' + !!p + ' submit=' + !!btn + '. Selectors: US=' + (US||'(auto)') + ' PS=' + (PS||'(auto)') + ' BS=' + (BS||'(auto)');",
            "      document.body.appendChild(d);",
            "    }",
            "  }, 500);",
            "})();"
          ];
          fs.writeFileSync(path, JSON.stringify(pake, null, 2) + '\n');

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        run: |
          ARGS=("${{ inputs.url }}" "--name" "${{ inputs.name }}")

          if [ -n "${{ inputs.icon }}" ]; then
            ARGS+=("--icon" "${{ inputs.icon }}")
          fi

          if [ -n "${{ inputs.width }}" ]; then
            ARGS+=("--width" "${{ inputs.width }}")
          fi

          if [ -n "${{ inputs.height }}" ]; then
            ARGS+=("--height" "${{ inputs.height }}")
          fi

          if [ "${{ inputs.fullscreen }}" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "${{ inputs.hide_title_bar }}" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "${{ inputs.multi_arch }}" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ "${{ inputs.debug }}" == "true" ]; then
            ARGS+=("--debug")
          fi

          if [ -n "${{ inputs.targets }}" ] && [ "${{ runner.os }}" == "Linux" ]; then
            ARGS+=("--targets" "${{ inputs.targets }}")
          fi

          echo "Running: node dist/cli.js ${ARGS[@]}"
          node dist/cli.js "${ARGS[@]}"

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $args = "${{ inputs.url }}", "--name", "${{ inputs.name }}"

          if ("${{ inputs.icon }}" -ne "") {
            $args += "--icon", "${{ inputs.icon }}"
          }

          if ("${{ inputs.width }}" -ne "") {
            $args += "--width", "${{ inputs.width }}"
          }

          if ("${{ inputs.height }}" -ne "") {
            $args += "--height", "${{ inputs.height }}"
          }

          if ("${{ inputs.fullscreen }}" -eq "true") {
            $args += "--fullscreen"
          }

          if ("${{ inputs.hide_title_bar }}" -eq "true") {
            $args += "--hide-title-bar"
          }

          if ("${{ inputs.debug }}" -eq "true") {
            $args += "--debug"
          }

          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          node dist/cli.js $args

          git checkout -- src-tauri/Cargo.lock

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: ${{ inputs.name }}.deb
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: ${{ inputs.name }}.AppImage
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload MSI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          retention-days: 3

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
