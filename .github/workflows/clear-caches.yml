name: Clear Caches

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches
        run: |
          gh cache list --limit 100 --json id --jq '.[].id' | while read id; do
            echo "Deleting cache $id"
            gh cache delete "$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}
