name: Windows Build (Edge Snap)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-format:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --color=always --check

  windows-clippy:
    name: Clippy (Windows target)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Install clippy
        run: rustup component add clippy

      - name: Run Clippy
        run: cargo clippy

  windows-build:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [windows-format, windows-clippy]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build release
        run: cargo build --release
        timeout-minutes: 30
